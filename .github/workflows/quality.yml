name: Qualidade de código
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes Python
        run: python -m unittest discover -s tests -v
      - name: Sintaxe Python
        run: python -m compileall -q job_hunter.py scripts tests
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe PHP
        run: |
          php -l php/api/vagas.php
          php -l docker/router.php
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar TypeScript
        run: |
          npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
          npx tsc --project web/tsconfig.json
