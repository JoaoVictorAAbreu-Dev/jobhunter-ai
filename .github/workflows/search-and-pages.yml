name: Buscar vagas e publicar painel
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Buscar vagas
        run: python job_hunter.py buscar
      - name: Gerar painel público
        run: python scripts/build_site.py
      - name: Salvar CSV privado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: vagas-para-revisar
          path: |
            vagas_para_revisar.csv
            avisos_busca.txt
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
